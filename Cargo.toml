[workspace]
resolver = "3"
members = [
    "crates/evidence-format",
    "crates/pump-core",
    "crates/report-kit",
    "apps/pump-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eu-cristofer/inspection-suite"
authors = ["Costa Inspection and the <Suite> contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
uom = { version = "0.38.0", default-features = false, features = ["f64", "si", "std", "use_serde"] }
thiserror = "2.0.21"
